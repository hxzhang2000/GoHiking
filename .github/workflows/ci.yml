name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: 生成占位 local.properties（CI 无真实 Key，只跑编译与测试）
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
          echo "AMAP_KEY_DEBUG=ci-placeholder" >> local.properties
          echo "AMAP_KEY_RELEASE=ci-placeholder" >> local.properties

      # ---- 门禁：中英资源键对齐（F-I18N-09）----
      - run: ./gradlew checkStringKeys

      # ---- 单元测试 ----
      - run: ./gradlew testDebugUnitTest

      # ---- 门禁：Lint（含 HardcodedText / MissingTranslation，F-I18N-40/41）----
      - run: ./gradlew lintDebug

      # ---- 编译 ----
      - run: ./gradlew assembleDebug

      # ---- 静态检查（M0 后续接入 ktlint / detekt 后放开，DEV §7.4）----
      # - run: ./gradlew ktlintCheck detekt
      # - run: ./gradlew koverXmlReport

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '**/build/reports/**'
