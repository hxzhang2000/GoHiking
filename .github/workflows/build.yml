name: Build

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # 构建.job：打 v* tag 时产出 release APK 并创建 GitHub Release（说明取自 CHANGELOG 对应小节）
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # N-15：wrapper 里曾经提交的是开发者本机 file:/// 路径，CI 靠这个 sed 兜底。
      # 现已改回官方地址，本步骤变冗余；保留只是为了防止有人再把本机路径提交上来。
      - name: Use network Gradle distribution
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" 2>&1 || true

      # 签名密钥双模式（与 NASMusicTV 同款）：
      #   - 模式 A（正式签名）：仓库 Secrets 配置 SIGNING_KEYSTORE_BASE64（keystore 文件的 base64）
      #     及 SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD 时，
      #     解码出 keystore/release-key.jks 签名——产出与本地一致的正式发布 APK。
      #     base64 生成：base64 -w0 keystore/gohiking.jks | clip（或 certutil -encode）
      #   - 模式 B（fallback）：未配置 secrets 时临时生成 ci-keystore.jks，
      #     只用于 CI 验证「能编译 + 签名通过」，APK 不可覆盖安装到已有数据的设备。
      # keystore.properties 的 storeFile 相对 app/ 目录解析（本地值 ../keystore/gohiking.jks），
      # CI 写入 ../keystore/release-key.jks 保持同一约定（见 app/build.gradle.kts signingConfigs）。
      - name: Set up signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "Using release keystore from GitHub Secrets"
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > keystore/release-key.jks
            {
              echo "storeFile=../keystore/release-key.jks"
              echo "storePassword=$SIGNING_STORE_PASSWORD"
              echo "keyAlias=$SIGNING_KEY_ALIAS"
              echo "keyPassword=$SIGNING_KEY_PASSWORD"
            } > keystore.properties
          else
            echo "No signing secrets found, falling back to throwaway CI keystore"
            keytool -genkey -v -keystore keystore/ci-keystore.jks -alias ci -keyalg RSA -keysize 2048 -validity 3650 -storepass ci-pass -keypass ci-pass -dname "CN=CI,OU=CI,O=CI,L=CI,S=CI,C=CI"
            {
              echo "storeFile=../keystore/ci-keystore.jks"
              echo "storePassword=ci-pass"
              echo "keyAlias=ci"
              echo "keyPassword=ci-pass"
            } > keystore.properties
          fi
          echo "=== keystore.properties (passwords redacted) ==="
          sed 's/\(storePassword\|keyPassword\)=.*/\1=<redacted>/' keystore.properties

      # N-14：local.properties 被 .gitignore 排除，checkout 后不存在。此前 CI 从未注入
      # 高德 Key，产出的 release APK 里 com.amap.api.v2.apikey 为空串 → 下载者安装后地图
      # 全白屏、定位鉴权失败。这里在构建前生成 local.properties。
      - name: Inject AMap key
        env:
          AMAP_KEY_RELEASE: ${{ secrets.AMAP_KEY_RELEASE }}
        run: |
          if [ -n "$AMAP_KEY_RELEASE" ]; then
            echo "AMAP_KEY_RELEASE=$AMAP_KEY_RELEASE" > local.properties
            echo "AMAP_KEY_DEBUG=$AMAP_KEY_RELEASE" >> local.properties
          else
            echo "::warning::AMAP_KEY_RELEASE secret 未配置，本次构建的 release APK 将无高德 Key（地图白屏）"
            echo "AMAP_KEY_RELEASE=" > local.properties
          fi

      - name: Build release APK
        # checkStringKeys 合并自旧 ci.yml（F-I18N-09 中英键对齐门禁；ci.yml 已删除，本文件是唯一 CI）
        # amapKeyOptional=true 仅在「没配 secret 也要验证编译」时放行 N-14 的构建期断言
        env:
          ORG_GRADLE_PROJECT_amapKeyOptional: ${{ secrets.AMAP_KEY_RELEASE == '' }}
        run: ./gradlew assembleRelease :core:resources:checkStringKeys --stacktrace

      - name: Rename APK
        run: |
          # 版本号单一事实源 = gradle.properties（2026-09-20 起，app/build.gradle.kts 只读取）
          VERSION=$(grep '^gohiking.versionName' gradle.properties | cut -d= -f2)
          VERSION_DASHED=$(echo "$VERSION" | tr '.' '-')
          echo "APK_VERSION=$VERSION" >> $GITHUB_ENV
          echo "APK_VERSION_DASHED=$VERSION_DASHED" >> $GITHUB_ENV
          ls -la app/build/outputs/apk/release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoHiking-release-v${{ env.APK_VERSION_DASHED }}
          path: app/build/outputs/apk/release/*.apk

      # Release 说明：从 CHANGELOG.md 提取 `## [vTAG]` 到下一个小节
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # L-24：原分支 A 用 `/^## \[/ { found=1 }` 匹配「第一个小节」，而 CHANGELOG 的
          # 第一个小节是 [Unreleased] —— 实测会把未发布内容一起写进 Release 说明
          # （25 行输出，首行即 `## [Unreleased]`）。分支 B 才是正确的按 tag 定位。
          # 两个分支统一为按当前 tag 定位小节，结构上不可能包含 Unreleased。
          awk -v tag="$TAG" '
            $0 ~ "^## \\[" tag "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::warning::CHANGELOG.md 里找不到 ## [$TAG] 小节，Release 说明为空"
          fi
          echo "=== Release notes ==="
          cat release_notes.md
          echo "=== End ==="
          echo "File size: $(wc -c < release_notes.md) bytes"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          APK="app/build/outputs/apk/release/GoHiking-release-v${{ env.APK_VERSION_DASHED }}.apk"
          # 删除已存在的 release（如果有），重新创建
          if gh release view "$TAG" --json tagName &>/dev/null; then
            echo "Deleting existing release $TAG..."
            gh release delete "$TAG" --yes
          fi
          echo "Creating release $TAG..."
          ARGS=("--notes-file" "release_notes.md" "--title" "GoHiking $TAG")
          if [ -f "$APK" ]; then
            gh release create "$TAG" "${ARGS[@]}" "$APK"
          else
            gh release create "$TAG" "${ARGS[@]}"
          fi

  # 单元测试：与本地门禁同口径
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use network Gradle distribution
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip|' gradle/wrapper/gradle-wrapper.properties
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      # testDebugUnitTest 需 Android SDK（android.jar）；与 build job 显式安装保持一致
      - name: Set up Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" 2>&1 || true
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

  # Room 迁移校验（N-35）：
  # DEV §3.1 要求每个迁移配 MigrationTestHelper 测试，但那需要 Android 插桩环境，
  # 仓库里实际上一个都没有 —— 迁移是零覆盖上线的。Room 运行时会拿迁移后的真实 schema
  # 与 N.json 逐项比对，不一致就抛 "Migration didn't properly handle"，用户升级即崩溃。
  # 这个 job 用 Python + sqlite3 复现同一条校验，**不需要 Android SDK**，几秒跑完。
  room-migrations:
    name: Room migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # schema JSON 由 exportSchema=true 的构建生成，必须已提交进仓库（含新增的 3.json）
      - name: Verify Room migrations
        run: python3 tools/db-verify/verify_room_migrations.py

  # lint：本地门禁 warningsAsErrors=true，CI 同为阻塞门禁
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use network Gradle distribution
        run: |
          sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip|' gradle/wrapper/gradle-wrapper.properties
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-35" "build-tools;35.0.0" 2>&1 || true
      - name: Run lint
        run: ./gradlew lintDebug --stacktrace
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn
