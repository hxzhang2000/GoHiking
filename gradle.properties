# GoHiking 构建属性

# ── 应用版本（单一事实源，2026-09-20 起）──
# 升级流程：改这里 → CHANGELOG.md 补条目 → （release 时）同步 PRD 7.3 generator.versionName
# 语义：0.x = 开发期（0.1.0=M0 骨架 / 0.2.0=M1 记录 / 0.3.0=M2 计划线路 / 0.4.0=M3 提醒与数据交换 + M4 照片地图与打磨
#                      / 0.5.0=两轮审查修复与文档体系收尾〔非里程碑批次〕
#                      / 0.5.1=第二轮审查 LOW 打磨项与门禁加固〔非里程碑批次〕
#                      / 0.5.2=UI 原型对标（P-01~P-18 页面级对齐 + 底部 Tab 导航 + 关于页））；1.0.0 = 首个正式发布
# N-53：versionCode 曾恒为 1，但 v0.3.0 已打 tag 并由 CI 产出对外分发的 APK ——
# 后续版本若仍为 1，已装旧版的用户无法覆盖升级（Android 只接受更大的 versionCode）。
# 按 CHANGELOG 的定版记录对齐：v0.3.0=1 / v0.4.0=2 / v0.5.0=3 / v0.5.1=4 / v0.5.2=5。
# 规则：每次**对外分发** +1（开发期本地构建不递增）；升版本时同步改这里。
gohiking.versionName=0.5.2
gohiking.versionCode=5

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# KSP2 + Room 2.6.1 存在 MissingType 假错（google/ksp#1896），强制走 KSP1 处理器；
# 待 Room 升级到 2.7+ 后可移除此行（DEV §7.1.1 版本基线随裁定同步）
ksp.useKSP2=false
# Kotlin DSL 异步 IO 关闭超时兜底（DefaultAsyncIOScopeFactory.close TimeoutException，慢盘/杀进程后易触发）
systemProp.org.gradle.kotlin.dsl.internal.io.timeout=180000
# 本机 build-cache-1 .part 文件反复「拒绝访问」（Defender/索引服务抢锁），禁用全局构建缓存换稳定。
# N-54：此前文件上方还有一行 org.gradle.caching=true，后值静默覆盖前值，
# 读代码的人会以为开了缓存。整个仓库只保留这一处。
org.gradle.caching=false
