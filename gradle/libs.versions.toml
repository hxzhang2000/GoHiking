# GoHiking 依赖版本基线（docs/DEV-DESIGN.md §1.3，M0 锁定方案 A）
# ✅ 版本号已全部核实真实存在（tools/m0-verify/01_maven_versions.py，T-14/B1）。
# ⚠ ksp 版本必须与 kotlin 精确匹配（<kotlin>-<ksp>）；kotlin-compose 插件版本必须与 kotlin 完全一致。
[versions]
agp = "8.7.3"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
composeBom = "2024.12.01"
hilt = "2.53.1"
room = "2.6.1"
datastore = "1.1.1"
serialization = "1.7.3"
coil = "3.0.4"
timber = "5.0.1"
coroutines = "1.9.0"
navigation = "2.8.5"
junit = "4.13.2"
vico = "3.3.1"           # ✅ 稳定线（T-10：直接用 v3，不备 MPAndroidChart）
amapMap = "10.0.600"     # 公网 Maven 可解析的最新 3dmap（jar 无 aar，manifest/权限需 App 自声明）
amapLocation = "6.4.9"   # ⚠ 已停用（2026-09-20）：3dmap 10.0.600 内嵌完整定位 API+实现（col/3l 602 类），再引 location 会重复 32 类构建失败；坐标保留备查
amapSearch = "9.7.1"     # ✅ POI 搜索 / 输入提示 / 路径规划都在 search 包，必须单独引（T-01）
javaxInject = "1"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version = "1.7.0" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.15.0" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version = "1.9.3" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version = "2.8.7" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version = "2.8.7" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version = "1.3.7" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-video = { group = "io.coil-kt.coil3", name = "coil-video", version.ref = "coil" }
timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }
vico-compose-m3 = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }
junit4 = { group = "junit", name = "junit", version.ref = "junit" }
amap-map3d = { group = "com.amap.api", name = "3dmap", version.ref = "amapMap" }
amap-location = { group = "com.amap.api", name = "location", version.ref = "amapLocation" }
amap-search = { group = "com.amap.api", name = "search", version.ref = "amapSearch" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
